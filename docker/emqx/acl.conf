%% Backend: MQTT_USERNAME=ingest
{allow, {username, "ingest"}, publish, ["#"]}.
{allow, {username, "ingest"}, subscribe, ["#"]}.
%% "#" does not cover $-prefixed topics: needed for broker connect/disconnect events (reason codes).
{allow, {username, "ingest"}, subscribe, ["$SYS/#"]}.

%% Agent username = deviceId (fake TAB-* agents and real ANDROID_ID).
{allow, all, publish, ["rc/state/${clientid}", "rc/probe/${clientid}", "rc/event/${clientid}"]}.
{allow, all, subscribe, ["rc/cmd/${clientid}"]}.

{deny, all}.
